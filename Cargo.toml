[package]
name = "simd-utf16-len"
version = "0.3.0"
edition = "2024"
description = "SIMD-accelerated UTF-16 length calculation from UTF-8 strings"
license = "MIT"
repository = "https://github.com/SyMind/simd-utf16-len"
# benches/inputs.rs is a shared module, not a benchmark.
autobenches = false

[dependencies]

[features]
# Opt in to the AVX-512BW kernel on x86_64, as in napi-rs/json-escape-simd.
avx512 = []

# Criterion doesn't build for wasm32, and the unit tests don't need it.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "4.7" }

# tests/guard_pages.rs maps guard pages with mmap/mprotect.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[[bench]]
name = "utf16_len"
harness = false

[[bench]]
name = "kernel"
harness = false
