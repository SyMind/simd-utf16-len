name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      # Optimizations change how the kernels compile, and debug assertions
      # are off, so test release builds too.
      - run: cargo test --release

  wasm:
    name: Test (wasm32, ${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simd128
            rustflags: -C target-feature=+simd128
          - name: scalar fallback
            rustflags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: cargo test --lib --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
          RUSTFLAGS: ${{ matrix.rustflags }}

  sde:
    name: Test (x86_64 kernels, Intel SDE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: petarpetrovt/setup-sde@v6.0
      # Most runners don't expose AVX-512, so emulate a Sapphire Rapids CPU,
      # which has it, and require every x86_64 kernel to run, in debug and
      # release builds.
      - run: cargo test --lib && cargo test --lib --release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.SDE_PATH }}/sde64 -spr --
          SIMD_UTF16_LEN_EXPECT_KERNELS: sse2,avx2
