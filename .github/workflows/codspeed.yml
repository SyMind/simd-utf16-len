name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: CodSpeed measurement mode
        type: choice
        options:
          - walltime
          - simulation
        default: walltime

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed@4.7.0
      - name: Build the benchmark target(s)
        run: cargo codspeed build -m "${{ inputs.mode || 'walltime' }}"
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: ${{ inputs.mode || 'walltime' }}
          run: cargo codspeed run
