name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: CodSpeed measurement mode
        type: choice
        options:
          - simulation
          - walltime
        default: simulation
      lto:
        description: Use Rspack release LTO settings
        type: boolean
        default: false
      runner:
        description: Benchmark runner
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
        default: ubuntu-latest

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ inputs.lto && 'fat' || 'off' }}
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: ${{ inputs.lto && '1' || '16' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed@4.7.0
      - name: Build the benchmark target(s)
        run: cargo codspeed build -m "${{ inputs.mode || 'simulation' }}"
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: ${{ inputs.mode || 'simulation' }}
          run: cargo codspeed run
